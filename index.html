<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9a3412" />
    <title>Free Website Builder Using AI</title>
    <meta
      name="description"
      content="A free class for building a website with AI, GitHub, and Cloudflare Pages. No credit card."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Free Website Builder Using AI" />
    <meta
      property="og:description"
      content="A free class for building a website with AI, GitHub, and Cloudflare Pages. No credit card."
    />
    <meta property="og:image" content="/og.jpg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("fwb-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("fwb-lang");
          if (l === "ta" || l === "ml" || l === "en") document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
